---
# NOTE: la clé de dédup du watcher est (namespace, workload, reason) avec cooldown 1 h —
# pour re-tester dans l'heure, incrémente le suffixe -vN des noms de pods.
# Scenario 1 — CrashLoopBackOff avec une vraie cause racine dans les logs :
# Leandro doit la citer (connexion DB refusée), pas juste dire "ça crashe".
# securityContext conforme aux policies Kyverno du cluster :
# require-run-as-nonroot + require-ro-rootfs.
apiVersion: v1
kind: Pod
metadata:
  name: leandro-watch-test-crashloop-v2
  namespace: platform-team
  labels:
    app: leandro-watch-test
spec:
  restartPolicy: Always
  containers:
    - name: boom
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "[startup] leandro-watch-test v1.0 initializing"
          echo "FATAL: cannot connect to database db-primary.internal:5432 — connection refused"
          sleep 2
          exit 1
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        seccompProfile: { type: RuntimeDefault }
---
# Scenario 2 — ImagePullBackOff : image inexistante, diagnostic attendu
# "l'image n'existe pas dans le registre", clé de dédup différente du scenario 1.
apiVersion: v1
kind: Pod
metadata:
  name: leandro-watch-test-imagepull-v2
  namespace: platform-team
  labels:
    app: leandro-watch-test
spec:
  containers:
    - name: ghost
      image: registry.internal.example.com/does-not-exist/leandro-test:v0.0.1
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        seccompProfile: { type: RuntimeDefault }
